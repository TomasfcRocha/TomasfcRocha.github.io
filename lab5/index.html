<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercícios de JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. BOTÕES DE CORES -->
  <section>
    <h2>1. Botões de cores</h2>
    <p id="frase">A programação é a arte de dizer a outro humano o que queremos que o computador faça.</p>
    <button class="color" data-color="tomato">Tomate</button>
    <button class="color" data-color="seagreen">Verde-mar</button>
    <button class="color" data-color="orchid">Orquídea</button>
    <button class="color" data-color="goldenrod">Dourado</button>
  </section>
  <hr>

  <!-- 2. SELECT COR DA PÁGINA -->
  <section>
    <h2>2. Select: cor da página</h2>
    <label>Cor da página:
      <select id="cor-pagina">
        <option value="white">Branco</option>
        <option value="lightblue">Azul claro</option>
        <option value="lightgreen">Verde claro</option>
        <option value="khaki">Caqui</option>
      </select>
    </label>
  </section>
  <hr>

  <!-- 3. SELECT FLEX -->
  <section>
    <h2>3. Select flex</h2>
    <label>Direção:
      <select id="direcao">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
        <option value="column-reverse">column-reverse</option>
      </select>
    </label>
    <div id="container">
      <div class="bola"></div>
      <div class="bola"></div>
      <div class="bola"></div>
      <div class="bola"></div>
    </div>
  </section>
  <hr>

  <!-- 4. FORMULÁRIO -->
  <section>
    <h2>4. Formulário</h2>
    <form id="formulario">
      <label for="nome"></label><input id="nome" type="text" placeholder="insira o seu nome" required>
      <label for="idade"></label><input id="idade" type="number" placeholder="insira a sua idade" min="0" required>
      <input type="submit">
    </form>
    <p id="mensagem"></p>
  </section>
  <hr>

  <!-- 5. CONTADOR COM LOCAL STORAGE -->
  <section>
    <h2>5. Contador com Local Storage</h2>
    <h1 id="contador-ls">0</h1>
    <button id="incrementar">Incrementar</button>
    <button id="decrementar">Decrementar</button>
    <button id="reset-ls">Reset</button>
  </section>
  <hr>

  <!-- 6. TEMPORIZADOR -->
  <section>
    <h2>6. Temporizador</h2>
    <h1 id="contador-timer">0</h1>
    <button id="parar">Parar</button>
    <button id="retomar">Retomar</button>
    <button id="reset-timer">Reset</button>
  </section>


  <script src="script.js"></script>
</body>
</html>
